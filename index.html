<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="惠惠狗">
    <link rel="apple-touch-icon" href="image111.jpeg">
    <title>惠惠狗在偷偷做什么！</title>

    <style>
        :root {
            --primary-color: #ff9a9e;
            --bg-color: #fdfbfb;
            --box-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #fff0f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 50px;
        }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.5s;
        }
        .loader-img { width: 120px; height: 120px; border-radius: 25px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); } 50% { transform: scale(1.05); } 100% { transform: scale(0.95); } }

        .hidden { display: none !important; }

        .checkin-panel {
            max-width: 500px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, #fff7f7, #ffffff);
            border: 2px solid rgba(255, 154, 158, 0.35);
            border-radius: 22px;
            box-shadow: 0 8px 24px rgba(255,154,158,0.18);
            padding: 14px;
            text-align: center;
        }

        .checkin-title {
            color: var(--primary-color);
            font-weight: 800;
            font-size: 17px;
            margin-bottom: 10px;
        }

        .checkin-photo {
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            border-radius: 18px;
            background: #fff;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .checkin-btn {
            border: none;
            border-radius: 999px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            background: var(--primary-color);
            box-shadow: 0 5px 14px rgba(255,154,158,0.35);
            font-family: inherit;
            cursor: pointer;
        }

        .checkin-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .checkin-actions {
            margin-top: 12px;
            display: grid;
            gap: 10px;
        }

        .checkin-action-btn {
            border: none;
            border-radius: 14px;
            padding: 11px 14px;
            font-size: 15px;
            background: #fff0f0;
            color: #555;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        .checkin-hint {
            color: #999;
            font-size: 12px;
            margin-top: 9px;
            line-height: 1.5;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 26px; color: var(--primary-color); margin: 10px 0 5px; }
        .header p { color: #888; font-size: 13px; margin: 0; }

        .status-dot {
            display: inline-block; width: 8px; height: 8px;
            background-color: #ccc; border-radius: 50%; margin-left: 5px;
            transition: background-color 0.3s;
        }
        .status-dot.online { background-color: #4CAF50; }

        .date-container { display: flex; justify-content: center; margin-bottom: 25px; }
        input[type="date"] {
            padding: 12px 18px; font-size: 16px;
            border: 2px solid var(--primary-color);
            border-radius: 25px; outline: none;
            background: var(--box-bg); color: var(--text-color);
            font-family: inherit; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .schedule-container {
            max-width: 500px; margin: 0 auto;
            background: var(--box-bg); border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            padding: 15px 20px;
        }

        .time-slot {
            display: flex; align-items: flex-start;
            padding: 14px 0; border-bottom: 1px dashed #eee;
        }
        .time-slot:last-child { border-bottom: none; }
        .time-label { font-weight: bold; color: #666; width: 60px; flex-shrink: 0; margin-top: 10px; font-size: 14px; }

        .action-input {
            flex-grow: 1; border: none;
            background: #f8f9fa; 
            padding: 10px 15px;
            border-radius: 12px; font-size: 16px; outline: none;
            transition: background 0.3s, box-shadow 0.3s;
            resize: none; 
            overflow: hidden;
            line-height: 1.5;
            font-family: inherit;
            min-height: 44px; 
            display: block;
            box-sizing: border-box;
        }
        .action-input:focus { background: var(--accent-color); box-shadow: 0 0 0 2px rgba(255,154,158,0.2); }


        .save-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            box-sizing: border-box;
        }

        .save-modal-box {
            width: 100%;
            max-width: 520px;
            max-height: 92vh;
            overflow: auto;
            background: #fff;
            border-radius: 22px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.28);
        }

        .save-modal-box h2 {
            color: var(--primary-color);
            font-size: 20px;
            margin: 6px 0 10px;
        }

        .save-modal-box p {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin: 8px 0 14px;
        }

        .save-modal-img {
            width: 100%;
            max-height: 62vh;
            object-fit: contain;
            border-radius: 16px;
            background: #f8f8f8;
            margin-bottom: 14px;
        }

        .save-modal-btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 13px 16px;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            background: var(--primary-color);
            font-family: inherit;
            margin-top: 8px;
        }

        .save-modal-cancel {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 700;
            color: #666;
            background: #f3f3f3;
            font-family: inherit;
            margin-top: 8px;
        }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%); background: rgba(0, 0, 0, 0.75);
            color: white; padding: 12px 25px; border-radius: 25px;
            font-size: 15px; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; z-index: 1000;
            white-space: nowrap;
        }
    </style>

    <script>
        // 防止任何 Firebase/Storage 脚本错误导致页面永远停在加载页
        window.addEventListener('load', function () {
            setTimeout(function () {
                var loading = document.getElementById('loading-screen');
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(function () { loading.style.display = 'none'; }, 500);
                }
            }, 1500);
        });

        window.addEventListener('error', function (event) {
            console.error('页面错误：', event.message, event.error);
        });

        window.addEventListener('unhandledrejection', function (event) {
            console.error('异步错误：', event.reason);
        });
    </script>

</head>
<body>

    <div id="loading-screen">
        <img src="image111.jpeg" class="loader-img">
        <p style="color: #ff9a9e; margin-top: 15px; font-weight: bold; font-size: 18px;">正在同步北京时间...</p>
    </div>

    <div class="checkin-panel hidden" id="checkin-panel">
        <div class="checkin-title">📸 惠惠狗今日晚间打卡</div>
        <img id="checkin-photo" class="checkin-photo hidden" alt="惠惠狗今日打卡照">
        <button class="checkin-btn" id="checkin-main-btn">惠惠狗打卡</button>
        <input type="file" id="checkin-file" accept="image/*" capture="environment" class="hidden">
        <div class="checkin-actions hidden" id="checkin-actions">
            <button class="checkin-action-btn" id="save-cute-btn">保存到相册（帅帅）</button>
            <button class="checkin-action-btn" id="like-delete-btn">删除本张并点赞（不错）</button>
            <button class="checkin-action-btn" id="dislike-delete-btn">删除本张并踩一脚（丑丑）</button>
        </div>
        <div class="checkin-hint">打卡/上传限北京时间 23:00–次日 01:00；已上传后可检查到次日 23:00。</div>
    </div>

    <div class="header">
        <div style="text-align: center; margin-bottom: 15px;">
            <img src="image111.jpeg" style="width: 90px; height: 90px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); object-fit: cover;">
        </div>
        <h1>🐶 惠惠狗在偷偷做什么！</h1>
        <p>当前同步：北京时间 <span class="status-dot" id="status-dot"></span></p>
    </div>

    <div class="date-container">
        <input type="date" id="date-picker">
    </div>

    <div class="schedule-container" id="schedule-container"></div>

    <div class="save-modal hidden" id="save-modal">
        <div class="save-modal-box">
            <h2>帅帅照片保存确认 💖</h2>
            <p>请长按下面这张图片，选择“保存到照片/存储到照片”。保存完成后，再点下面按钮删除网站里的照片。</p>
            <img id="save-modal-img" class="save-modal-img" alt="待保存的惠惠狗打卡照">
            <button class="save-modal-btn" id="confirm-saved-btn">我已保存，删除网站照片</button>
            <button class="save-modal-cancel" id="cancel-save-btn">先不删，我还没保存</button>
        </div>
    </div>

    <div class="toast" id="toast">同步成功 ☁️🐾</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCU__iZvv2-ywIWo1inzs2tjE2Yvu5P4Sg",
            authDomain: "huihuidog-6c160.firebaseapp.com",
            projectId: "huihuidog-6c160",
            storageBucket: "huihuidog-6c160.firebasestorage.app",
            messagingSenderId: "59923454412",
            appId: "1:59923454412:web:6c652d94b4d9a6085de569",
            measurementId: "G-LJKZQ7TFZ6",
            databaseURL: "https://huihuidog-6c160-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        const datePicker = document.getElementById('date-picker');
        const container = document.getElementById('schedule-container');
        const statusDot = document.getElementById('status-dot');
        const toast = document.getElementById('toast');

        const checkinPanel = document.getElementById('checkin-panel');
        const checkinPhoto = document.getElementById('checkin-photo');
        const checkinMainBtn = document.getElementById('checkin-main-btn');
        const checkinFile = document.getElementById('checkin-file');
        const checkinActions = document.getElementById('checkin-actions');
        const saveCuteBtn = document.getElementById('save-cute-btn');
        const likeDeleteBtn = document.getElementById('like-delete-btn');
        const dislikeDeleteBtn = document.getElementById('dislike-delete-btn');
        const saveModal = document.getElementById('save-modal');
        const saveModalImg = document.getElementById('save-modal-img');
        const confirmSavedBtn = document.getElementById('confirm-saved-btn');
        const cancelSaveBtn = document.getElementById('cancel-save-btn');

        let currentCheckinData = null;
        let diaryUnsubscribe = null;
        let checkinUnsubscribe = null;

        function showToast(message) {
            toast.textContent = message;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 1500);
        }

        function getBeijingParts() {
            const formatter = new Intl.DateTimeFormat('zh-CN', {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            const parts = formatter.formatToParts(new Date());
            const obj = {};
            parts.forEach(p => obj[p.type] = p.value);
            return obj;
        }

        function getBeijingDateString() {
            const p = getBeijingParts();
            return `${p.year}-${p.month}-${p.day}`;
        }

        function getPreviousBeijingDateString() {
            const now = new Date();
            const bjMillis = now.getTime() + (8 * 60 + now.getTimezoneOffset()) * 60 * 1000;
            const prevBjDate = new Date(bjMillis - 24 * 60 * 60 * 1000);

            const year = prevBjDate.getUTCFullYear();
            const month = String(prevBjDate.getUTCMonth() + 1).padStart(2, '0');
            const day = String(prevBjDate.getUTCDate()).padStart(2, '0');

            return `${year}-${month}-${day}`;
        }

        function getCheckinDateString() {
            const p = getBeijingParts();
            const hour = Number(p.hour);

            // 23:00-23:59 算今天晚上的打卡；
            // 00:00-01:00 算前一天晚上的打卡，避免跨午夜后照片和状态丢失。
            if (hour < 1) {
                return getPreviousBeijingDateString();
            }

            return getBeijingDateString();
        }

        function isCheckinUploadTimeNow() {
            const p = getBeijingParts();
            const minutes = Number(p.hour) * 60 + Number(p.minute);

            // 仅允许北京时间 23:00 到次日 01:00 上传/拍照
            return minutes >= 23 * 60 || minutes <= 1 * 60;
        }

        datePicker.value = getBeijingDateString();

        function autoResize(el) {
            el.style.height = '44px';
            if (el.scrollHeight > 44) {
                el.style.height = el.scrollHeight + 'px';
            }
        }

        function createUI() {
            container.innerHTML = '';
            for(let i = 0; i < 24; i++) {
                const slot = document.createElement('div');
                slot.className = 'time-slot';
                slot.innerHTML = `<div class="time-label">${i.toString().padStart(2, '0')}:00</div>
                                  <textarea class="action-input" placeholder="惠惠狗在..." id="hour-${i}" rows="1"></textarea>`;
                container.appendChild(slot);

                const textarea = slot.querySelector('textarea');
                textarea.addEventListener('input', () => autoResize(textarea));
                textarea.addEventListener('change', (e) => {
                    set(ref(db, `huihui_diary/${datePicker.value}/${i}`), e.target.value);
                    showToast('同步成功 ☁️🐾');
                });
            }
        }

        function listen(date) {
            if (diaryUnsubscribe) diaryUnsubscribe();

            diaryUnsubscribe = onValue(ref(db, `huihui_diary/${date}`), (snapshot) => {
                const data = snapshot.val() || {};
                for(let i = 0; i < 24; i++) {
                    const el = document.getElementById(`hour-${i}`);
                    if (document.activeElement !== el) {
                        el.value = data[i] || '';
                        autoResize(el);
                    }
                }
                statusDot.classList.add('online');
            });
        }

        function renderCheckin(data) {
            currentCheckinData = data || null;

            const alreadyDone = data && data.status === 'completed';
            const hasPhoto = data && data.status === 'uploaded' && data.url;
            const canUploadNow = isCheckinUploadTimeNow();

            if (alreadyDone) {
                checkinPanel.classList.add('hidden');
                checkinActions.classList.add('hidden');
                checkinPhoto.classList.add('hidden');
                return;
            }

            // 没有照片时，只有 23:00-次日 01:00 显示“惠惠狗打卡”按钮。
            // 有照片后，照片和“萌萌检查完毕”按钮会一直显示到次日 23:00。
            if (!hasPhoto && !canUploadNow) {
                checkinPanel.classList.add('hidden');
                checkinActions.classList.add('hidden');
                checkinPhoto.classList.add('hidden');
                return;
            }

            checkinPanel.classList.remove('hidden');

            if (hasPhoto) {
                checkinPhoto.src = data.url;
                checkinPhoto.classList.remove('hidden');
                checkinMainBtn.textContent = '萌萌检查完毕';
                checkinMainBtn.disabled = false;
            } else {
                checkinPhoto.removeAttribute('src');
                checkinPhoto.classList.add('hidden');
                checkinActions.classList.add('hidden');
                checkinMainBtn.textContent = '惠惠狗打卡';
                checkinMainBtn.disabled = false;
            }
        }

        function listenCheckin() {
            if (checkinUnsubscribe) checkinUnsubscribe();

            const today = getCheckinDateString();
            checkinUnsubscribe = onValue(ref(db, `huihui_checkin/${today}`), (snapshot) => {
                renderCheckin(snapshot.val());
            });
        }

        function waitWithTimeout(promise, ms, message) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
            ]);
        }

        function compressImage(file, maxWidth = 1280, quality = 0.82) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();

                reader.onload = () => {
                    img.onload = () => {
                        const scale = Math.min(1, maxWidth / img.width);
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        canvas.toBlob((blob) => {
                            if (!blob) {
                                reject(new Error('图片压缩失败'));
                                return;
                            }
                            resolve(blob);
                        }, 'image/jpeg', quality);
                    };

                    img.onerror = () => reject(new Error('图片读取失败，请换一张图片'));
                    img.src = reader.result;
                };

                reader.onerror = () => reject(new Error('无法读取图片文件'));
                reader.readAsDataURL(file);
            });
        }

        async function uploadCheckinPhoto(file) {
            if (!file) return;

            if (!isCheckinUploadTimeNow()) {
                showToast('打卡时间已过，明晚 23:00 再来 🐾');
                return;
            }

            if (!file.type.startsWith('image/')) {
                showToast('只能上传图片哦 🐶');
                return;
            }

            checkinMainBtn.disabled = true;
            checkinMainBtn.textContent = '压缩中...';

            try {
                const today = getCheckinDateString();
                const compressedBlob = await compressImage(file);
                const path = `huihui_checkin/${today}/checkin.jpg`;
                const imgRef = storageRef(storage, path);

                checkinMainBtn.textContent = '上传中...';

                await waitWithTimeout(
                    uploadBytes(imgRef, compressedBlob, { contentType: 'image/jpeg' }),
                    20000,
                    '上传超时，请检查网络或 Firebase Storage 设置'
                );

                const url = await waitWithTimeout(
                    getDownloadURL(imgRef),
                    10000,
                    '获取图片链接超时'
                );

                await set(ref(db, `huihui_checkin/${today}`), {
                    status: 'uploaded',
                    url,
                    path,
                    uploadedAt: new Date().toISOString()
                });

                showToast('打卡成功 📸🐾');
            } catch (err) {
                console.error(err);

                let msg = err && err.message ? err.message : '上传失败';
                if (String(err.code || '').includes('storage/unauthorized')) {
                    msg = '上传失败：Firebase Storage 权限未开放';
                }
                if (String(err.code || '').includes('storage/bucket-not-found')) {
                    msg = '上传失败：Firebase Storage 存储桶不存在';
                }
                if (String(err.code || '').includes('storage/canceled')) {
                    msg = '上传已取消';
                }

                showToast(msg);
                checkinMainBtn.textContent = '惠惠狗打卡';
            } finally {
                checkinMainBtn.disabled = false;
            }
        }

        async function deletePhotoFromStorageIfNeeded() {
            if (currentCheckinData && currentCheckinData.path) {
                try {
                    await deleteObject(storageRef(storage, currentCheckinData.path));
                } catch (err) {
                    console.warn('Storage photo delete skipped/failed:', err);
                }
            }
        }

        function downloadPhoto(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = `惠惠狗打卡-${getCheckinDateString()}.jpg`;
            a.target = '_blank';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        async function finishCheckin(action) {
            const today = getCheckinDateString();

            try {
                if (action === 'save' && currentCheckinData && currentCheckinData.url) {
                    saveModalImg.src = currentCheckinData.url;
                    saveModal.classList.remove('hidden');
                    checkinActions.classList.add('hidden');
                    showToast('请长按图片保存到相册');
                    return;
                }

                await deletePhotoFromStorageIfNeeded();

                await set(ref(db, `huihui_checkin/${today}`), {
                    status: 'completed',
                    action,
                    photoDeleted: true,
                    completedAt: new Date().toISOString()
                });

                checkinPanel.classList.add('hidden');

                if (action === 'like') showToast('不错！已点赞并删除 👍');
                if (action === 'dislike') showToast('丑丑！已踩一脚并删除 🐾');
            } catch (err) {
                console.error(err);
                showToast(err && err.message ? err.message : '操作失败，请重试');
            }
        }

        async function confirmSavedAndDelete() {
            const today = getCheckinDateString();

            try {
                confirmSavedBtn.disabled = true;
                confirmSavedBtn.textContent = '删除中...';

                await deletePhotoFromStorageIfNeeded();

                await set(ref(db, `huihui_checkin/${today}`), {
                    status: 'completed',
                    action: 'save',
                    photoDeleted: true,
                    completedAt: new Date().toISOString(),
                    deletedAt: new Date().toISOString()
                });

                saveModal.classList.add('hidden');
                checkinPanel.classList.add('hidden');
                showToast('帅帅已保存，网站照片已删除 💖');
            } catch (err) {
                console.error(err);
                showToast(err && err.message ? err.message : '删除失败，请重试');
            } finally {
                confirmSavedBtn.disabled = false;
                confirmSavedBtn.textContent = '我已保存，删除网站照片';
            }
        }

        checkinMainBtn.addEventListener('click', () => {
            const hasPhoto = currentCheckinData && currentCheckinData.status === 'uploaded' && currentCheckinData.url;
            if (hasPhoto) {
                checkinActions.classList.toggle('hidden');
            } else {
                if (!isCheckinUploadTimeNow()) {
                    showToast('现在不能打卡哦，23:00–01:00 再来 🐶');
                    return;
                }
                checkinFile.click();
            }
        });

        checkinFile.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            uploadCheckinPhoto(file);
            e.target.value = '';
        });

        saveCuteBtn.addEventListener('click', () => finishCheckin('save'));
        likeDeleteBtn.addEventListener('click', () => finishCheckin('like'));
        dislikeDeleteBtn.addEventListener('click', () => finishCheckin('dislike'));
        confirmSavedBtn.addEventListener('click', confirmSavedAndDelete);
        cancelSaveBtn.addEventListener('click', () => {
            saveModal.classList.add('hidden');
            showToast('没删除，照片还在网站上');
        });

        datePicker.addEventListener('change', () => { createUI(); listen(datePicker.value); });

        try {
            createUI();
            listen(datePicker.value);

            try {
                listenCheckin();
                setInterval(() => {
                    listenCheckin();
                    renderCheckin(currentCheckinData);
                }, 60 * 1000);
            } catch (checkinErr) {
                console.error('打卡功能启动失败，但日程同步继续：', checkinErr);
                showToast('打卡功能暂时异常，日程同步正常');
            }
        } catch (err) {
            console.error('页面启动失败：', err);
            showToast('页面启动失败，请看 Console 错误');
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loading = document.getElementById('loading-screen');
                if (loading) {
                    loading.style.opacity = '0'; 
                    setTimeout(() => loading.style.display='none', 500);
                }
            }, 800);
        });
    </script>
</body>
</html>
